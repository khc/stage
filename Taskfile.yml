version: "3"

vars:
  FLOCI: http://localhost:4588
  PROJECT: floci-local
  REGION: us-central1
  JOB: my-agent-job
  IMAGE: agent-jobs-agent:latest
  JOBS_URL: "{{.FLOCI}}/v2/projects/{{.PROJECT | urlquery}}/locations/{{.REGION | urlquery}}/jobs"
  JOB_URL: "{{.JOBS_URL}}/{{.JOB | urlquery}}"

env:
  JOB_PROJECT: "{{.PROJECT}}"
  JOB_REGION: "{{.REGION}}"
  JOB_NAME: "{{.JOB}}"
  JOB_IMAGE: "{{.IMAGE}}"
  JOB_FLOCI: "{{.FLOCI}}"

tasks:
  create-job:
    desc: Create the agent Cloud Run job in Floci (override with e.g. JOB=my-job)
    cmds:
      - bun scripts/cloud-run-job.ts create

  update-job:
    desc: Update the agent job image and environment in Floci from .env
    cmds:
      - bun scripts/cloud-run-job.ts update

  list-jobs:
    desc: List the Cloud Run jobs in Floci as JSON (pipe to jq; override PROJECT, REGION, FLOCI)
    silent: true
    cmds:
      - curl -fsS {{.JOBS_URL | shellQuote}}

  remove-job:
    desc: Delete a Cloud Run job from Floci, after confirmation (JOB=my-job, --yes to skip the prompt)
    prompt: Remove job {{.JOB}} from Floci?
    cmds:
      - curl -fsS -X DELETE {{.JOB_URL | shellQuote}}
