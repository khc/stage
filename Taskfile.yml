version: "3"

vars:
  FLOCI: http://localhost:4588
  PROJECT: demo
  REGION: us-central1
  JOB: my-agent-job
  IMAGE: agent-jobs-agent:latest
  AGENT_MESSAGE: hello
  JOBS_URL: "{{.FLOCI}}/v2/projects/{{.PROJECT | urlquery}}/locations/{{.REGION | urlquery}}/jobs"
  JOB_URL: "{{.JOBS_URL}}/{{.JOB | urlquery}}"
  JOB_BODY: >-
    {"template":{"template":{"containers":[{"image":{{.IMAGE | toJson}},"env":[{"name":"AGENT_MESSAGE","value":{{.AGENT_MESSAGE | toJson}}}]}]}}}

tasks:
  create-job:
    desc: Create the agent Cloud Run job in Floci (override with e.g. JOB=my-job AGENT_MESSAGE="hi")
    cmds:
      - >-
        curl -fsS -X POST
        "{{.FLOCI}}/v2/projects/{{.PROJECT}}/locations/{{.REGION}}/jobs?jobId={{.JOB}}"
        -H 'content-type: application/json'
        -d {{.JOB_BODY | shellQuote}}

  list-jobs:
    desc: List the Cloud Run jobs in Floci as JSON (pipe to jq; override PROJECT, REGION, FLOCI)
    silent: true
    cmds:
      - curl -fsS {{.JOBS_URL | shellQuote}}

  remove-job:
    desc: Delete a Cloud Run job from Floci, after confirmation (JOB=my-job, --yes to skip the prompt)
    prompt: Remove job {{.JOB}} from Floci?
    cmds:
      - curl -fsS -X DELETE {{.JOB_URL | shellQuote}}
