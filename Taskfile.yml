version: "3"

vars:
  FLOCI: http://localhost:4588
  PROJECT: floci-local
  REGION: us-central1
  # One Cloud Run job per agent app (apps/<name>); the job, the app and the
  # image (agent-jobs-<name>:latest) share its name. Override to pick some,
  # e.g. `task rebuild JOBS=poet-agents`.
  JOBS: generic-agents poet-agents
  SERVICES_URL: "{{.FLOCI}}/v2/projects/{{.PROJECT | urlquery}}/locations/{{.REGION | urlquery}}/services"
  JOBS_URL: "{{.FLOCI}}/v2/projects/{{.PROJECT | urlquery}}/locations/{{.REGION | urlquery}}/jobs"

env:
  JOB_PROJECT: "{{.PROJECT}}"
  JOB_REGION: "{{.REGION}}"
  JOB_FLOCI: "{{.FLOCI}}"

tasks:
  rebuild:
    desc: Rebuild the agent images, one per job in JOBS; run register-agents afterwards if the agents changed
    cmds:
      - for: { var: JOBS }
        cmd: docker build -f Dockerfile.agents --build-arg APP={{.ITEM}} -t agent-jobs-{{.ITEM}}:latest .

  create-job:
    desc: Create the agent Cloud Run jobs in Floci (one per job in JOBS)
    cmds:
      - for: { var: JOBS }
        cmd: JOB_NAME={{.ITEM}} JOB_IMAGE=agent-jobs-{{.ITEM}}:latest bun scripts/cloud-run-job.ts create

  update-job:
    desc: Update the agent jobs' image and environment in Floci from .env (one per job in JOBS)
    cmds:
      - for: { var: JOBS }
        cmd: JOB_NAME={{.ITEM}} JOB_IMAGE=agent-jobs-{{.ITEM}}:latest bun scripts/cloud-run-job.ts update

  register-agents:
    desc: Record the agents inside each job image in the registry (needs the service running; override JOBS, SERVICE_URL)
    cmds:
      - for: { var: JOBS }
        cmd: curl -fsS -X POST {{.SERVICE_URL | default "http://localhost:3000" | shellQuote}}/jobs/{{.ITEM | urlquery}}/register

  list-jobs:
    desc: List the Cloud Run jobs in Floci as JSON (pipe to jq; override PROJECT, REGION, FLOCI)
    silent: true
    cmds:
      - curl -fsS {{.JOBS_URL | shellQuote}}

  remove-job:
    desc: Delete a Cloud Run job from Floci, after confirmation (JOB=generic-agents, --yes to skip the prompt)
    requires:
      vars: [JOB]
    prompt: Remove job {{.JOB}} from Floci?
    cmds:
      - curl -fsS -X DELETE {{.JOBS_URL | shellQuote}}/{{.JOB | urlquery}}

  rebuild-extract:
    desc: Rebuild the extract service image (agent-jobs-extract:latest)
    cmds:
      - docker compose build extract

  create-extract:
    desc: Create the extract Cloud Run service in Floci; prints its URL (fails if it already exists)
    cmds:
      - >-
        curl -fsS -X POST {{printf "%s?serviceId=extract" .SERVICES_URL | shellQuote}}
        -H 'content-type: application/json'
        -d '{"template":{"containers":[{"image":"agent-jobs-extract:latest","ports":[{"containerPort":8080}]}]}}'
        | jq -r '.metadata.uri // .metadata.urls[0]'

  remove-extract:
    desc: Delete the extract Cloud Run service from Floci
    cmds:
      - curl -fsS -X DELETE {{printf "%s/extract" .SERVICES_URL | shellQuote}}
