version: "3"

vars:
  FLOCI: http://localhost:4588
  FLOCI_HOST: localhost:4588
  PROJECT: floci-local
  REGION: us-central1
  ENV: lcl
  # One Cloud Run job per agent app (agents/<name>). The image is
  # stage/<name>-agents:latest and the job is named stage--<name>-agents--job-<env> (stage--generic-agents--job-lcl).
  # Override to pick some, e.g. `task build:agents JOBS=poet`.
  JOBS: generic poet knowledge orchestrator
  SERVICES_URL: "{{.FLOCI}}/v2/projects/{{.PROJECT | urlquery}}/locations/{{.REGION | urlquery}}/services"
  JOBS_URL: "{{.FLOCI}}/v2/projects/{{.PROJECT | urlquery}}/locations/{{.REGION | urlquery}}/jobs"

includes:
  docker:
    taskfile: ./docker/Taskfile.yml
    flatten: true
  tf: ./infra/Taskfile.yml

env:
  JOB_PROJECT: "{{.PROJECT}}"
  JOB_REGION: "{{.REGION}}"
  JOB_FLOCI: "{{.FLOCI}}"

tasks:
  register-agents:
    desc: Record each agent app's agents in the registry, straight into Floci's Firestore (no Cloud Run execution; override JOBS, FLOCI_HOST, PROJECT, ENV)
    cmds:
      - for: { var: JOBS }
        cmd: JOB_NAME=stage--{{.ITEM}}-agents--job-{{.ENV}} FIRESTORE_EMULATOR_HOST={{.FLOCI_HOST}} GOOGLE_CLOUD_PROJECT={{.PROJECT}} bun --preload ./packages/agents/src/telemetry-init.ts agents/{{.ITEM}}/src/main.ts register

  list-jobs:
    desc: List the Cloud Run jobs in Floci as JSON (pipe to jq; override PROJECT, REGION, FLOCI)
    silent: true
    cmds:
      - curl -fsS {{.JOBS_URL | shellQuote}}

  remove-job:
    desc: Delete a Cloud Run job from Floci, after confirmation (JOB=stage--generic-agents--job-lcl, --yes to skip the prompt)
    requires:
      vars: [JOB]
    prompt: Remove job {{.JOB}} from Floci?
    cmds:
      - curl -fsS -X DELETE {{.JOBS_URL | shellQuote}}/{{.JOB | urlquery}}

  load-imdb:
    desc: Download the IMDb datasets (about 1.9 GB, non-commercial use only) and replace the tables of the imdb Cloud SQL Postgres in Floci, after confirmation (--yes to skip the prompt; options go after --, for example -- --only title.ratings,name.basics)
    prompt: Download the IMDb datasets and replace the data in the imdb database?
    cmds:
      - bun scripts/imdb-load.ts {{.CLI_ARGS}}
