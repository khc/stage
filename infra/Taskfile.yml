version: "3"

# Included by the root Taskfile as `tf`, so `task tf:apply` runs `apply` below. Tasks run from the repo root;
# PROJECT, REGION and JOBS come from the root Taskfile.

tasks:
  init:
    desc: Initialise Terraform in infra/envs/local (run once, and after provider or module changes)
    cmds:
      - terraform -chdir=infra/envs/local init

  apply:
    desc: Apply infra/envs/local to Floci with Terraform (jobs, extract service, topics); reads GEMINI_API_KEY, AGENT_MODEL, GOOGLE_GENAI_USE_VERTEXAI and OTEL_* from .env with yq, and the knowledge job's Qdrant, embedding, Neo4j and Exa settings with bun. Set REDEPLOY=true to replace services whose local Docker image changed (FORCE=true replaces all)
    cmds:
      - |
        env_value() { yq -p props -oy ".$1 // \"\"" .env; }
        export TF_VAR_gemini_api_key="$(env_value GEMINI_API_KEY)"
        model="$(env_value AGENT_MODEL)"; vertex="$(env_value GOOGLE_GENAI_USE_VERTEXAI)"
        [ -z "$model" ] || export TF_VAR_agent_model="$model"
        [ -z "$vertex" ] || export TF_VAR_use_vertexai="$vertex"
        export TF_VAR_otel_env="$(yq -p props -o=json -I=0 'with_entries(select((.key | test("^OTEL_")) and (.value != "")))' .env)"
        # bun reads .env as the ingestion CLI does; yq would keep the quotes around EMBEDDING_QUERY_PREFIX.
        export TF_VAR_knowledge_env="$(bun --env-file=.env -e 'const keys = ["QDRANT_API_KEY", "EMBEDDING_MODEL", "EMBEDDING_API_KEY", "EMBEDDING_QUERY_PREFIX", "RERANK_MODEL", "RERANK_API_KEY", "NEO4J_USER", "NEO4J_PASSWORD", "EXA_API_KEY"]; console.log(JSON.stringify(Object.fromEntries(keys.flatMap((key) => (process.env[key] ? [[key, process.env[key]]] : [])))))')"

        stamp_file="infra/envs/local/.deployed-images"
        image_for() {
          case "$1" in
            module.stage.google_cloud_run_v2_service.extract) echo "stage/extract-service:latest" ;;
            'module.stage.google_cloud_run_v2_service.service[0]') echo "stage/control-service:latest" ;;
            module.stage.google_cloud_run_v2_service.agent_services\[*)
              app="${1#module.stage.google_cloud_run_v2_service.agent_services[\"}"
              app="${app%\"]}"
              echo "stage/$app-agents:latest"
              ;;
          esac
        }
        set --
        if [ "{{.REDEPLOY}}" = "true" ]; then
          while IFS= read -r addr; do
            [ -n "$addr" ] || continue
            if [ "{{.FORCE}}" = "true" ]; then
              set -- "$@" "-replace=$addr"
              continue
            fi
            img="$(image_for "$addr")"
            id="$(docker image inspect --format '{{"{{"}}.Id{{"}}"}}' "$img" 2>/dev/null || true)"
            prev="$(grep -F "${addr}=" "$stamp_file" 2>/dev/null | head -n1 | cut -d= -f2- || true)"
            if [ -z "$id" ] || [ -z "$prev" ] || [ "$prev" != "$id" ]; then
              set -- "$@" "-replace=$addr"
            fi
          done <<EOF
        $(terraform -chdir=infra/envs/local state list 2>/dev/null | grep '^module\.stage\.google_cloud_run_v2_service\.' || true)
        EOF
        fi

        terraform -chdir=infra/envs/local apply "$@" {{.CLI_ARGS}}

        if [ "{{.REDEPLOY}}" = "true" ] || [ ! -f "$stamp_file" ]; then
          tmp_stamp="$(mktemp)"
          while IFS= read -r addr; do
            [ -n "$addr" ] || continue
            img="$(image_for "$addr")"
            [ -n "$img" ] || continue
            id="$(docker image inspect --format '{{"{{"}}.Id{{"}}"}}' "$img" 2>/dev/null || true)"
            [ -z "$id" ] || printf '%s=%s\n' "$addr" "$id" >> "$tmp_stamp"
          done <<EOF
        $(terraform -chdir=infra/envs/local state list 2>/dev/null | grep '^module\.stage\.google_cloud_run_v2_service\.' || true)
        EOF
          mv "$tmp_stamp" "$stamp_file"
        fi

  import:
    desc: Import Floci topics and jobs created outside Terraform into the local state; skips what is already in state. A job in JOBS that Floci does not have yet (for example knowledge-agents before the first `task tf:apply`) cannot be imported, so apply first or set JOBS to the existing ones
    dir: infra/envs/local
    cmds:
      - |
        export TF_VAR_gemini_api_key="$(yq -p props -oy '.GEMINI_API_KEY // ""' ../../../.env)"
        import() { terraform state show "$1" >/dev/null 2>&1 || terraform import "$1" "$2"; }
        for topic in agent-events platform-events; do
          import "module.stage.google_pubsub_topic.events[\"stage--$topic--ps-{{.ENV}}\"]" "projects/{{.PROJECT}}/topics/stage--$topic--ps-{{.ENV}}"
        done
        for app in {{.JOBS}}; do
          import "module.stage.google_cloud_run_v2_job.agents[\"$app\"]" "projects/{{.PROJECT}}/locations/{{.REGION}}/jobs/stage--$app-agents--job-{{.ENV}}"
        done

  create-job:
    desc: Create the agent Cloud Run jobs in Floci (alias of tf:apply; Terraform owns them, JOBS is ignored)
    cmds:
      - task: apply

  update-job:
    desc: Update the agent jobs' image and environment in Floci (alias of tf:apply; JOBS is ignored)
    cmds:
      - task: apply

  create-extract:
    desc: Create or update the extract Cloud Run service in Floci with Terraform; prints its URL
    cmds:
      - task: apply
      - terraform -chdir=infra/envs/local output -raw extract_url

  create-service:
    desc: Create or update the Elysia HTTP service (apps/control-service) as a Cloud Run service in Floci with Terraform; prints its URL (run build:control-service first)
    cmds:
      - task: apply
      - terraform -chdir=infra/envs/local output -raw service_url

  remove-service:
    desc: Delete the Elysia HTTP service from Floci with Terraform
    prompt: Remove the service from Floci?
    cmds:
      - terraform -chdir=infra/envs/local destroy -target='module.stage.google_cloud_run_v2_service.service[0]'

  remove-extract:
    desc: Delete the extract Cloud Run service from Floci with Terraform
    prompt: Remove the extract service from Floci?
    cmds:
      - terraform -chdir=infra/envs/local destroy -target=module.stage.google_cloud_run_v2_service.extract
