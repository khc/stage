services:
  floci-gcp:
    image: floci/floci-gcp:0.12.0
    ports:
      - "127.0.0.1:4588:4588"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-gcp-data:/app/data
    environment:
      FLOCI_GCP_BASE_URL: http://floci-gcp:4588
      FLOCI_GCP_STORAGE_MODE: hybrid

  floci-ui:
    image: floci/floci-ui:0.7.0
    ports:
      - "127.0.0.1:4500:4500"
    depends_on:
      floci-gcp:
        condition: service_healthy
    environment:
      FLOCI_GCP_ENDPOINT: http://floci-gcp:4588

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command: >-
      mlflow server --host 0.0.0.0 --port 5000 --workers 1
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --allowed-hosts localhost:5001,127.0.0.1:5001,host.docker.internal:5001,mlflow:5000
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - mlflow-data:/mlflow

  # Vector index for packages/ingestion (REST on 6333); stands in for Vertex AI Vector Search.
  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      # Qdrant allows any origin by default, so a web page could read it through localhost. This
      # blocks that, but not DNS rebinding (Qdrant does not check the Host header): set the key.
      - QDRANT__SERVICE__ENABLE_CORS=false
      # Set in .env to require an `api-key` header; left unset it is not passed (an empty value
      # would make Qdrant require an empty key). See the Ingestion block of .env.example.
      - QDRANT__SERVICE__API_KEY
    volumes:
      - qdrant-data:/qdrant/storage

  # Graph store for packages/ingestion catalog & data discovery (HTTP Query API v2 on 7474, Bolt on 7687).
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      # Neo4j allows any CORS origin (*) by default; restrict browser cross-origin reads to Neo4j Browser.
      - NEO4J_dbms_security_http__access__control__allow__origin=http://localhost:7474
      # Bound JVM heap and page cache for local dev so Neo4j does not over-allocate VM memory.
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
      # Set NEO4J_PASSWORD in .env before starting (`docker compose up -d neo4j`).
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
    volumes:
      - neo4j-data:/data

volumes:
  floci-gcp-data:
  mlflow-data:
  qdrant-data:
  neo4j-data:
