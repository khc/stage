services:
  floci-gcp:
    image: floci/floci-gcp:0.12.0
    ports:
      - "127.0.0.1:4588:4588"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-gcp-data:/app/data
    environment:
      FLOCI_GCP_BASE_URL: http://floci-gcp:4588
      FLOCI_GCP_STORAGE_MODE: hybrid

  floci-ui:
    image: floci/floci-ui:0.7.0
    ports:
      - "127.0.0.1:4500:4500"
    depends_on:
      floci-gcp:
        condition: service_healthy
    environment:
      FLOCI_GCP_ENDPOINT: http://floci-gcp:4588

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --allowed-hosts localhost:5001,127.0.0.1:5001,host.docker.internal:5001,mlflow:5000
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - mlflow-data:/mlflow

  # Vector index for packages/ingestion (REST on 6333); stands in for Vertex AI Vector Search.
  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      # Qdrant allows any origin by default, so a web page could call it through localhost.
      - QDRANT__SERVICE__ENABLE_CORS=false
      # Set in .env to require an `api-key` header; left unset it is not passed (an empty value
      # would make Qdrant require an empty key). See the Ingestion block of .env.example.
      - QDRANT__SERVICE__API_KEY
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  floci-gcp-data:
  mlflow-data:
  qdrant-data:
