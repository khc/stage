services:
  floci-gcp:
    image: floci/floci-gcp:0.12.0
    ports:
      - "127.0.0.1:4588:4588"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-gcp-data:/app/data
    environment:
      FLOCI_GCP_BASE_URL: http://floci-gcp:4588
      FLOCI_GCP_STORAGE_MODE: hybrid

  floci-ui:
    image: floci/floci-ui:0.7.0
    ports:
      - "127.0.0.1:4500:4500"
    depends_on:
      floci-gcp:
        condition: service_healthy
    environment:
      FLOCI_GCP_ENDPOINT: http://floci-gcp:4588

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --allowed-hosts localhost:5001,127.0.0.1:5001,host.docker.internal:5001,mlflow:5000
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - mlflow-data:/mlflow

volumes:
  floci-gcp-data:
  mlflow-data:
