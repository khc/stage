name: CI

# The checks, the UI build, the unit tests and the Floci integration tests run as separate jobs;
# only the UI build waits (for the checks). A version tag v1.2.3 also builds the images and
# publishes them to ghcr.io/khc/stage/<name>:1.2.3 (ci-image.yml), once everything else passes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its running checks; a run on main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            run: bun run lint --deny-warnings
          - name: format
            run: bun run format:check
          - name: typecheck
            run: bun run typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install / Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install / dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: ${{ matrix.run }}

  ui-build:
    name: ui build
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install / Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install / dependencies
        run: bun install --frozen-lockfile

      - name: Build / UI
        run: bun run --filter @stage/ui build

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install / Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install / dependencies
        run: bun install --frozen-lockfile

      - name: Test / unit
        run: bun run test

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Where the tests find Floci, started below.
      FIRESTORE_EMULATOR_HOST: localhost:4588
      GOOGLE_CLOUD_PROJECT: floci-local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install / Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install / dependencies
        run: bun install --frozen-lockfile

      # The compose file pins the Floci image; --wait returns once its health check passes.
      - name: Start / Floci
        run: docker compose up -d --wait floci-gcp

      - name: Test / integration
        run: bun run test:integration

      - name: Floci logs
        if: failure()
        run: docker compose logs floci-gcp

      - name: Stop / Floci
        if: always()
        run: docker compose down -v

  # Only a version tag publishes; pull requests and main build no images.
  images:
    name: image ${{ matrix.name }}
    needs: [check, ui-build, unit, integration]
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: generic-agents
            file: docker/Dockerfile.agents
            args: APP=generic
          - name: poet-agents
            file: docker/Dockerfile.agents
            args: APP=poet
          - name: knowledge-agents
            file: docker/Dockerfile.agents
            args: APP=knowledge
          - name: orchestrator-agents
            file: docker/Dockerfile.agents
            args: APP=orchestrator
          - name: control-service
            file: docker/Dockerfile.control-service
          - name: extract-service
            file: docker/Dockerfile.extract-service
          - name: ui
            file: docker/Dockerfile.ui
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write # push to ghcr.io
    with:
      name: ${{ matrix.name }}
      file: ${{ matrix.file }}
      build-args: ${{ matrix.args }}
